name: Rafraichissement 15 min

on:
  # declencheur principal : cron-job.org poste {"event_type":"collecte"} toutes les 15 min (fiable)
  repository_dispatch:
    types: [collecte]
  # filet de securite : planificateur GitHub horaire (si cron-job.org tombe)
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

# evite que deux rafraichissements se chevauchent
concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Rafraichir cotes + nouveaux matchs (mode leger)
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python collecte_auto.py --odds-only
      - name: Cotes source 2 (odds-api.io)
        env:
          ODDSAPI_IO_KEY: ${{ secrets.ODDSAPI_IO_KEY }}
        run: python odds2_auto.py || echo "source 2 indisponible (non bloquant)"
      - name: Publier les donnees
        run: |
          git config user.name "collecte-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -m "MAJ auto (15 min)" || echo "Rien a committer"
          git pull --rebase --autostash || true
          git push
